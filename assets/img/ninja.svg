<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Number Ninjas mascot">
  <defs>
    <radialGradient id="ng" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#2f8cff" stop-opacity=".55"/><stop offset="1" stop-color="#2f8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="nh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22397a"/><stop offset="1" stop-color="#0e1a3d"/></linearGradient>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fb0ff"/><stop offset="1" stop-color="#1f6fe0"/></linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#ng)"/>
  <!-- headband tails -->
  <path d="M150 78 C172 70 184 82 196 74 C188 90 172 92 156 90 Z" fill="url(#nb)"/>
  <path d="M150 86 C170 92 178 108 192 108 C178 118 162 108 152 96 Z" fill="#1f6fe0"/>
  <!-- head -->
  <circle cx="100" cy="104" r="66" fill="url(#nh)" stroke="#5fb0ff" stroke-width="4"/>
  <!-- headband -->
  <path d="M36 82 Q100 58 164 82 L162 98 Q100 76 38 98 Z" fill="url(#nb)"/>
  <circle cx="100" cy="76" r="9" fill="#0e1a3d" stroke="#bfe0ff" stroke-width="2.5"/>
  <text x="100" y="80.5" font-family="Arial Black,Arial" font-weight="900" font-size="12" fill="#bfe0ff" text-anchor="middle">×</text>
  <!-- eye opening -->
  <rect x="48" y="104" width="104" height="36" rx="18" fill="#f6cfa6"/>
  <!-- eyes -->
  <ellipse cx="78" cy="122" rx="11" ry="10" fill="#fff"/>
  <ellipse cx="122" cy="122" rx="11" ry="10" fill="#fff"/>
  <circle cx="80" cy="123" r="5.5" fill="#0e1a3d"/>
  <circle cx="120" cy="123" r="5.5" fill="#0e1a3d"/>
  <circle cx="82" cy="121" r="1.8" fill="#fff"/>
  <circle cx="122" cy="121" r="1.8" fill="#fff"/>
  <!-- brows -->
  <path d="M62 108 L92 114" stroke="#0e1a3d" stroke-width="6" stroke-linecap="round"/>
  <path d="M138 108 L108 114" stroke="#0e1a3d" stroke-width="6" stroke-linecap="round"/>
  <!-- mask lower -->
  <path d="M48 128 Q100 150 152 128 L150 140 Q100 176 50 140 Z" fill="#14244f"/>
  <!-- shuriken -->
  <g transform="translate(46 160) rotate(15)">
    <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z" fill="#cfe6ff" stroke="#5fb0ff" stroke-width="2"/>
    <circle r="3" fill="#1f6fe0"/>
  </g>
</svg>
